<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fastly.jsdelivr.net">
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Pretendard Variable',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
html,body{min-width:1440px;background:#FBFCFE}
a{color:#0064FF;text-decoration:none}a:hover{color:#0052cc}
.frame{width:1440px;height:900px;position:relative;overflow:hidden;background:#FBFCFE;margin:0 auto}
.bg{position:absolute;inset:0;filter:blur(3px) saturate(.92);transform:scale(1.01);transition:filter .4s,transform .4s}
.bg.clear{filter:none;transform:none}
.dim{position:absolute;inset:0;background:rgba(15,25,45,.42);backdrop-filter:blur(1px)}
.modalwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.modal{width:480px;background:#fff;border-radius:24px;box-shadow:0 40px 100px -30px #0a1f4a66,0 8px 24px #0a1f4a22;padding:34px 34px 28px;animation:pop .32s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.m-badge{width:56px;height:56px;border-radius:16px;background:#eef4ff;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.m-badge svg{width:30px;height:30px}
.m-title{font-size:23px;font-weight:800;letter-spacing:-.02em;color:#191F28}
.m-sub{margin-top:9px;font-size:14.5px;font-weight:500;color:#6b7684;line-height:1.55}
.infocard{margin-top:22px;background:#F7F8FA;border:1px solid #eef1f5;border-radius:16px;padding:20px 22px}
.ic-name{font-size:17px;font-weight:800;color:#191F28;letter-spacing:-.01em}
.ic-div{height:1px;background:#eceef1;margin:16px 0}
.ic-rows{display:flex;flex-direction:column;gap:13px}
.ic-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.ic-row-time{position:relative;background:#eaf1fe;padding:15px 22px;margin:0 -22px;border-radius:8px}
.ic-row-time::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:#0064FF}
.ic-lab{font-size:13.5px;font-weight:600;color:#8b95a1;flex-shrink:0}
.ic-val{font-size:14.5px;font-weight:700;color:#333d4b;text-align:right}
.ic-val.blue{color:#0064FF}
.ic-val.big{font-size:16px;font-weight:800}

.ic-place{display:flex;align-items:center;gap:8px;color:#4e5968}
.ic-place .gm{width:20px;height:20px;border-radius:6px;background:#f1f3f6;display:flex;align-items:center;justify-content:center;color:#8b95a1;flex-shrink:0}
.ic-place .gm svg{width:12px;height:12px}
.lk{width:24px;height:24px;border-radius:7px;border:1px solid #e6eaef;background:#fff;display:flex;align-items:center;justify-content:center;color:#8b95a1;cursor:pointer;transition:all .12s;flex-shrink:0;margin-left:2px}
.lk:hover{background:#f7f8fa;color:#4e5968;border-color:#dbe1e8}
.lk svg{width:13px;height:13px}
.m-btns{margin-top:24px;display:flex;gap:10px}
.btn-ghost{flex:1;height:54px;border:1px solid #e1e6ec;border-radius:14px;background:#fff;color:#4e5968;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;transition:all .12s}
.btn-ghost:hover{background:#f7f8fa;border-color:#d3d9e0}
.btn-primary{flex:1.4;height:54px;border:none;border-radius:14px;background:#0064FF;color:#fff;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 12px 26px -8px #0064ff88;transition:transform .12s,box-shadow .12s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 16px 32px -8px #0064ff99}
.success{width:452px;background:#fff;border-radius:22px;box-shadow:0 40px 100px -30px #0a1f4a55,0 8px 24px #0a1f4a1c;padding:30px 30px 24px;animation:pop .32s cubic-bezier(.2,.8,.3,1.1) both}
.s-badge{width:52px;height:52px;border-radius:15px;background:#e7f7ee;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.s-badge svg{width:28px;height:28px;color:#12a150}
.s-title{font-size:20px;font-weight:800;letter-spacing:-.02em;color:#191F28}
.s-time{margin-top:8px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:#4e5968;background:#f4f6f9;border:1px solid #eef1f5;padding:5px 11px;border-radius:9px}
.s-time svg{width:14px;height:14px;color:#8b95a1}
.s-sub{margin-top:12px;font-size:13.5px;font-weight:500;color:#6b7684;line-height:1.6}
.s-btns{margin-top:20px;display:flex;gap:9px}
.s-later{flex:1;height:48px;border:1px solid #e6eaef;border-radius:12px;background:#fff;color:#6b7684;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .12s}
.s-later:hover{background:#f7f8fa;border-color:#dbe1e8;color:#4e5968}
.s-write{flex:1.3;height:48px;border:1.5px solid #b9d4ff;border-radius:12px;background:#fff;color:#0064FF;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:7px}
.s-write:hover{background:#f4f8ff;border-color:#0064FF}
.s-write svg{width:16px;height:16px}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:60;padding:13px 20px;background:#191F28;border-radius:12px;color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 16px 40px #10357544;animation:tpop .25s ease both}
@keyframes tpop{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</helmet>
<div class="frame" data-screen-label="회의 시간 확정">
<div class="bg"><dc-import name="flow2-screen2-dashboard" hint-size="1440px,900px"></dc-import></div>
<div class="dim"></div>
<div class="modalwrap"><div class="modal">
<div class="m-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#0064FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
<div class="m-title">회의 시간을 확정할까요?</div>
<div class="m-sub">확정하면 참여자에게 기본 알림과 안내 메일이 전송돼요.</div>
<div class="infocard">
<div class="ic-name">온보딩 전환율 개선 TFT 킥오프</div>
<div class="ic-div"></div>
<div class="ic-rows">
<div class="ic-row ic-row-time"><span class="ic-lab">확정 시간</span><span class="ic-val blue big ic-time">{{ confirmTime }}</span></div>
<div class="ic-row"><span class="ic-lab">몰입도</span><span class="ic-val" style="color: #4E5968">{{ pctVal }}%</span></div>
<div class="ic-row"><span class="ic-lab">참여자</span><span class="ic-val" style="color: #4E5968">6명 (주최자 포함)</span></div>
<div class="ic-row"><span class="ic-lab">장소</span><span class="ic-val ic-place"><span class="gm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l6-3v10l-6-3z"></path><rect x="3" y="6" width="12" height="12" rx="2"></rect></svg></span>화상 · Google Meet</span></div>
</div>
</div>
<div class="m-btns"><button class="btn-ghost" onClick="{{ onCancel }}">취소</button><button class="btn-primary" onClick="{{ onConfirm }}">확정하기</button></div>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;recurrence&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;없음&quot;,&quot;매주&quot;,&quot;매달&quot;],&quot;default&quot;:&quot;없음&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Meeting&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const qs=new URLSearchParams(window.location.search);
    const qTime=qs.get('time'), qPct=qs.get('pct');
    const recur=this.props.recurrence??'없음';
    const defaultTime = recur==='매주' ? '매주 월요일 · 14:00–15:00' : (recur==='매달' ? '매달 20일 · 14:00–15:00' : '7/20 월 · 14:00–15:00');
    const confirmTime = qTime || defaultTime;
    return {
      confirmTime,
      pctVal: qPct || 92,
      onConfirm:()=>{ const qs2=new URLSearchParams({time:confirmTime}); window.location.href = 'flow2-screen5-confirmed.dc.html?'+qs2.toString(); },
      onCancel:()=>{ window.location.href = 'flow2-screen2-dashboard.dc.html'; }
    };
  }
}
</script>
</body>
</html>
